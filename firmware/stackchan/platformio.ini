; firmware/stackchan/platformio.ini
;
; Firmware for M5Stack's StackChan kit (CoreS3 + two SCS0009 servos) as the
; face of a lanbat voice satellite: pkgs/lva-stackchan drives it over USB.
; Build and flash: docs/stackchan.md.
;
; pioarduino (Arduino 3.3 on ESP-IDF 5.5) in hybrid mode, so that ESP-IDF
; components come in through custom_component_add: Espressif's current face
; detector (espressif/human_face_detect, esp-dl 3) needs ESP-IDF 5. The one
; bundled with Arduino 2.0.x scored a face 0.10-0.15 on this camera and
; found it in about one frame in a hundred.

[platformio]
default_envs = stackchan

[env:stackchan]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino
board_build.flash_mode = dio
board_upload.flash_size = 16MB
board_build.partitions = partitions.csv
board_build.arduino.memory_type = qio_qspi
upload_speed = 1500000
monitor_speed = 115200
build_flags =
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DCORE_DEBUG_LEVEL=0
    ; The hybrid build compiles these components into the framework's
    ; libraries but leaves them out of their include and link lists.
    -I$PROJECT_DIR/managed_components/espressif__human_face_detect
    -L$PROJECT_BUILD_DIR/$PIOENV/esp-idf/espressif__human_face_detect
    -lespressif__human_face_detect
    -I$PROJECT_DIR/managed_components/espressif__esp_new_jpeg/include
    -L$PROJECT_BUILD_DIR/$PIOENV/esp-idf/espressif__esp_new_jpeg
    -lespressif__esp_new_jpeg
; Hybrid compile: these settings rebuild the ESP-IDF libraries for this
; project, and with them the components of src/idf_component.yml.
; pioarduino rebuilds them when this text changes, not when the components
; do: after changing custom_component_add, delete the generated
; sdkconfig.defaults to rebuild.
custom_sdkconfig =
    CONFIG_SPIRAM=y
    CONFIG_SPIRAM_MODE_QUAD=y
    CONFIG_SPIRAM_SPEED_80M=y
    CONFIG_ESP32S3_DATA_CACHE_64KB=y
    CONFIG_ESP32S3_DATA_CACHE_LINE_64B=y
    CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB=y
    CONFIG_ESP_DEFAULT_CPU_FREQ_MHZ_240=y
custom_component_add =
    espressif/human_face_detect @ 0.5.0
    espressif/esp_new_jpeg @ 1.0.2
; esp-sr (speech recognition; the Pi listens, not the robot) registers the
; list of operations esp-dl compiles, and the face model needs one it lacks
; (Concat: "dl::Model: Do not support Concat"). Without it, esp-dl compiles
; them all.
custom_component_remove =
    espressif/esp-sr
lib_deps =
    m5stack/M5Unified@0.2.25
    m5stack/M5GFX@0.2.32
    https://github.com/m5stack/StackChan-BSP.git#8d4d6fc3b7a6be379c6317c45a02a30bff8c492e
    meganetaaan/M5Stack-Avatar@0.10.0
    bblanchon/ArduinoJson@7.4.3
